<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAMN - Main Bareng</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  *{box-sizing:border-box} body{margin:0;background:#0f1115;color:white;font-family:Arial;text-align:center;padding:20px}
  h1{font-size:42px;letter-spacing:8px;margin:10px 0 0} p{color:#aaa}
  .card{background:#1a1d24;border:1px solid #333;border-radius:16px;padding:20px;max-width:400px;margin:20px auto}
  button{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:10px;cursor:pointer}
  .btn-blue{background:#2e6bff;color:white} .btn-green{background:#00c853;color:white} .btn-dark{background:#222;color:white;border:1px solid #444}
  input{width:100%;padding:14px;border-radius:10px;border:1px solid #444;background:#111;color:white;text-align:center;font-size:20px;letter-spacing:4px}
  #board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:15px auto}
  .cell{aspect-ratio:1;background:#222;border-radius:10px;font-size:36px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .hidden{display:none}
</style>
</head>
<body>
<h1>DAMN</h1>
<p>Main Bareng - Offline & Online</p>

<div id="menu" class="card">
  <button class="btn-green" onclick="startOffline()">📱 OFFLINE - Main Berdua 1 HP</button>
  <button class="btn-blue" onclick="showOnline()">🌐 ONLINE - Main Beda HP</button>
  <p style="font-size:13px">Offline paling gampang, langsung main!</p>
</div>

<div id="onlineMenu" class="card hidden">
  <p>Nama Kamu</p><input id="myName" placeholder="Contoh: Alvin" style="letter-spacing:1px">
  <button class="btn-blue" onclick="buatRoom()">Buat Room</button>
  <hr style="border-color:#333">
  <p>Kode Room Teman</p><input id="joinCode" placeholder="1234" maxlength="4">
  <button class="btn-dark" onclick="masukRoom()">Masuk Room</button>
  <button class="btn-dark" onclick="back()">← Kembali</button>
  <p id="onlineInfo"></p>
</div>

<div id="game" class="card hidden">
  <h3 id="status">Giliran: X</h3>
  <div id="board"></div>
  <p id="roomInfo"></p>
  <button class="btn-dark" onclick="location.reload()">Keluar / Menu Utama</button>
</div>

<script>
let board = ["","","","","","","","",""];
let turn = "X";
let mode = "offline";
let peer, conn, myCode = "";
let isHost = false;
let myTurnOnline = "X";

function startOffline(){
  mode="offline"; document.getElementById('menu').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('roomInfo').innerText = "Mode: OFFLINE - Gantian di 1 HP";
  render();
}
function showOnline(){
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('onlineMenu').classList.remove('hidden');
}
function back(){
  document.getElementById('onlineMenu').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
}
function render(){
  let b = document.getElementById('board'); b.innerHTML="";
  board.forEach((v,i)=>{
    let d=document.createElement('div'); d.className='cell'; d.innerText=v;
    d.onclick=()=>klik(i); b.appendChild(d);
  });
  document.getElementById('status').innerText = cekMenang() ? "Menang: "+cekMenang() : "Giliran: "+turn;
}
function klik(i){
  if(board[i]!="" || cekMenang()) return;
  if(mode==="online" && turn!==myTurnOnline) return alert("Bukan giliran lu!");
  board[i]=turn;
  if(mode==="online" && conn) conn.send({board, turn});
  turn = turn==="X"?"O":"X";
  render();
}
function cekMenang(){
  let w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(let p of w){ if(board[p[0]] && board[p[0]]===board[p[1]] && board[p[1]]===board[p[2]]) return board[p[0]]; }
  return null;
}
function buatRoom(){
  let name=document.getElementById('myName').value||"Host";
  myCode = Math.floor(1000+Math.random()*9000).toString();
  peer = new Peer("damn-"+myCode);
  peer.on('open', ()=>{
    isHost=true; myTurnOnline="X";
    document.getElementById('onlineInfo').innerHTML="<b>Kode lu: "+myCode+"</b><br>Kirim ke teman lu, tunggu dia masuk...";
  });
  peer.on('connection', (c)=>{
    conn=c; startOnlineGame();
    c.on('data', (d)=>{ board=d.board; turn=d.turn; render(); });
  });
}
function masukRoom(){
  let code=document.getElementById('joinCode').value;
  let name=document.getElementById('myName').value||"Tamu";
  if(!code) return alert("Isi kode dulu!");
  peer = new Peer();
  peer.on('open', ()=>{
    conn = peer.connect("damn-"+code);
    conn.on('open', ()=>{ myTurnOnline="O"; startOnlineGame(); });
    conn.on('data', (d)=>{ board=d.board; turn=d.turn; render(); });
    setTimeout(()=>{ if(!conn.open) alert("Kode salah / Host belum buat room!"); }, 5000);
  });
}
function startOnlineGame(){
  mode="online";
  document.getElementById('onlineMenu').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('roomInfo').innerText = "Mode: ONLINE - Kode: "+(myCode||document.getElementById('joinCode').value)+" | Lu adalah: "+myTurnOnline;
  render();
}
</script>
</body>
  </html>
