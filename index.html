<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAMN - Catur</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;background:#0f1115;color:#fff;font-family:Arial;text-align:center;padding:15px}
h1{font-size:42px;letter-spacing:10px;margin:5px} p{color:#aaa}
.card{background:#1a1d24;border:1px solid #333;border-radius:16px;padding:18px;max-width:460px;margin:15px auto}
button{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:10px;cursor:pointer}
.btn-green{background:#00c853;color:#fff} .btn-blue{background:#2e6bff;color:#fff} .btn-dark{background:#222;color:#fff;border:1px solid #444}
input{width:100%;padding:13px;border-radius:10px;border:1px solid #444;background:#111;color:#fff;text-align:center;font-size:18px}
#board{display:grid;grid-template-columns:repeat(8,1fr);gap:0;max-width:400px;margin:12px auto;border:2px solid #444}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;user-select:none}
.light{background:#ebecd0;color:#000} .dark{background:#739552;color:#000}
.sel{outline:3px solid yellow;z-index:1} .can{outline:3px solid #00ff00 inset;box-shadow:inset 0 0 0 3px #00ff00}
.hidden{display:none}
</style>
</head>
<body>
<h1>DAMN</h1><p>Catur - Offline & Online</p>

<div id="menu" class="card">
<button class="btn-green" onclick="startOffline()">📱 OFFLINE - Catur Berdua 1 HP</button>
<button class="btn-blue" onclick="showOnline()">🌐 ONLINE - Catur Beda HP</button>
<p style="font-size:13px">Offline: lu & teman gantian di HP yang sama. Pasti jalan!</p>
</div>

<div id="onlineMenu" class="card hidden">
<p>Nama Kamu</p><input id="myName" placeholder="Alvin">
<button class="btn-blue" onclick="buatRoom()">Buat Room</button>
<hr style="border-color:#333">
<p>Kode Room Teman</p><input id="joinCode" placeholder="1234" maxlength="4">
<button class="btn-dark" onclick="masukRoom()">Masuk Room</button>
<button class="btn-dark" onclick="back()">← Kembali</button>
<p id="onlineInfo"></p>
</div>

<div id="game" class="card hidden">
<h3 id="status">Giliran: Putih</h3>
<div id="board"></div>
<p id="roomInfo"></p>
<p style="font-size:13px">Cara main: Klik bidak lu, terus klik kotak tujuan yang hijau.</p>
<button class="btn-dark" onclick="location.reload()">Keluar / Menu Utama</button>
</div>

<script>
let mode="offline", peer, conn, myCode="", myColor="w", selected=null;
let board = [
["r","n","b","q","k","b","n","r"],
["p","p","p","p","p","p","p","p"],
["","","","","","","",""],
["","","","","","","",""],
["","","","","","","",""],
["","","","","","","",""],
["P","P","P","P","P","P","P","P"],
["R","N","B","Q","K","B","N","R"]
];
let turn="w";
let emoji={P:"♙",R:"♖",N:"♘",B:"♗",Q:"♕",K:"♔",p:"♟",r:"♜",n:"♞",b:"♝",q:"♛",k:"♚"};

function isWhite(p){return p && p===p.toUpperCase();}
function startOffline(){mode="offline"; document.getElementById('menu').classList.add('hidden'); document.getElementById('game').classList.remove('hidden'); document.getElementById('roomInfo').innerText="Mode: OFFLINE - Berdua 1 HP"; render();}
function showOnline(){document.getElementById('menu').classList.add('hidden'); document.getElementById('onlineMenu').classList.remove('hidden');}
function back(){document.getElementById('onlineMenu').classList.add('hidden'); document.getElementById('menu').classList.remove('hidden');}

function render(){
  let b=document.getElementById('board'); b.innerHTML="";
  let moves = selected ? legalMoves(selected[0],selected[1]) : [];
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    let d=document.createElement('div'); d.className='cell '+((r+c)%2==0?'light':'dark');
    d.innerText = board[r][c] ? emoji[board[r][c]] : "";
    if(selected && selected[0]==r && selected[1]==c) d.classList.add('sel');
    if(moves.some(m=>m[0]==r&&m[1]==c)) d.classList.add('can');
    d.onclick=()=>klik(r,c); b.appendChild(d);
  }
  document.getElementById('status').innerText = "Giliran: "+(turn=="w"?"Putih ♙":"Hitam ♟") + (mode=="online" ? " | Lu: "+(myColor=="w"?"Putih":"Hitam") : "");
}
function klik(r,c){
  if(mode=="online" && turn!==myColor) return;
  let p=board[r][c];
  if(selected){
    let moves=legalMoves(selected[0],selected[1]);
    if(moves.some(m=>m[0]==r&&m[1]==c)){
      board[r][c]=board[selected[0]][selected[1]]; board[selected[0]][selected[1]]="";
      // promosi pion jadi ratu
      if(board[r][c]=="P" && r==0) board[r][c]="Q";
      if(board[r][c]=="p" && r==7) board[r][c]="q";
      turn=turn=="w"?"b":"w"; selected=null;
      if(mode=="online" && conn) conn.send({board,turn});
      render(); return;
    }
  }
  if(p && ((turn=="w" && isWhite(p)) || (turn=="b" && !isWhite(p)))) selected=[r,c];
  else selected=null;
  render();
}
function inside(r,c){return r>=0&&r<8&&c>=0&&c<8;}
function legalMoves(r,c){
  let p=board[r][c]; if(!p) return []; let res=[]; let w=isWhite(p); let type=p.toLowerCase();
  function add(rr,cc){ if(!inside(rr,cc)) return false; let t=board[rr][cc]; if(!t){res.push([rr,cc]); return true;} if(isWhite(t)!==w){res.push([rr,cc]);} return false; }
  if(type=="p"){
    let dir=w?-1:1, start=w?6:1;
    if(inside(r+dir,c) && !board[r+dir][c]){res.push([r+dir,c]); if(r==start && !board[r+dir*2][c]) res.push([r+dir*2,c]);}
    for(let dc of [-1,1]){ if(inside(r+dir,c+dc) && board[r+dir][c+dc] && isWhite(board[r+dir][c+dc])!==w) res.push([r+dir,c+dc]); }
  }
  if(type=="n"){ for(let [dr,dc] of [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]) add(r+dr,c+dc); }
  if(type=="b"||type=="q"){ for(let [dr,dc] of [[-1,-1],[-1,1],[1,-1],[1,1]]){ for(let k=1;k<8;k++){ if(!add(r+dr*k,c+dc*k)) break; } } }
  if(type=="r"||type=="q"){ for(let [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){ for(let k=1;k<8;k++){ if(!add(r+dr*k,c+dc*k)) break; } } }
  if(type=="k"){ for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){ if(dr||dc) add(r+dr,c+dc); } }
  return res;
}
function buatRoom(){
  myCode=Math.floor(1000+Math.random()*9000).toString();
  peer=new Peer("damn-catur-"+myCode);
  peer.on('open',()=>{ document.getElementById('onlineInfo').innerHTML="<b>Kode lu: "+myCode+"</b><br>Kirim ke teman, tunggu dia masuk..."; });
  peer.on('connection',(c)=>{ conn=c; myColor="w"; startOnlineGame(); c.on('data',(d)=>{board=d.board; turn=d.turn; render();}); });
}
function masukRoom(){
  let code=document.getElementById('joinCode').value; if(!code) return alert("Isi kode dulu!");
  peer=new Peer();
  peer.on('open',()=>{ conn=peer.connect("damn-catur-"+code); conn.on('open',()=>{ myColor="b"; startOnlineGame(); }); conn.on('data',(d)=>{board=d.board; turn=d.turn; render();}); setTimeout(()=>{if(!conn.open) alert("Kode salah / Host belum buat room!");},5000); });
}
function startOnlineGame(){ mode="online"; document.getElementById('onlineMenu').classList.add('hidden'); document.getElementById('game').classList.remove('hidden'); document.getElementById('roomInfo').innerText="Mode: ONLINE - Kode: "+(myCode||document.getElementById('joinCode').value)+" | Lu: "+(myColor=="w"?"Putih":"Hitam"); render(); }
</script>
</body>
</html>
