<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CATUR RAJA ONLINE</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
body{background:#111;color:#fff;font-family:Arial;text-align:center;padding:10px}
h1{color:#ffcc00;margin:5px}
#info,#loginBox,#menu{background:#222;padding:14px;border-radius:12px;margin:10px}
#board{width:320px;margin:10px auto;border:4px solid #ffcc00}
.row{display:flex}.cell{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer}
.w{background:#f0d9b5}.b{background:#b58863}
.pW{color:#fff;text-shadow:0 0 2px #000,1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.pB{color:#000;text-shadow:0 0 2px #fff,1px 1px 0 #fff,-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff}
.sel{background:yellow!important}.dot{background:#22c55e!important}.eat{background:#ef4444!important}
button{background:#ffcc00;border:0;padding:11px 14px;border-radius:10px;font-weight:bold;margin:4px}
input{padding:11px;border-radius:10px;border:0;width:200px;text-align:center;margin:4px}
.hide{display:none}
.avatar{width:55px;height:55px;border-radius:50%;background:#ffcc00;color:#000;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;margin:5px auto}
</style></head>
<body>
<h1>♞ CATUR RAJA ONLINE ♞</h1>

<div id="loginBox">
<div class="avatar">♞</div>
<h3 id="loginTitle">LOGIN / DAFTAR</h3>
<input id="userName" placeholder="Nama Kamu (mis: Alvin)"><br>
<input id="userPass" type="password" placeholder="Password"><br>
<button onclick="doLogin()">🔑 Login</button>
<button onclick="doDaftar()">📝 Daftar Akun Baru</button>
<p id="loginMsg" style="font-size:13px;color:#ffcc00"></p>
<p style="font-size:12px;opacity:.6">Akun tersimpan di HP kamu, aman.</p>
</div>

<div id="userBar" class="hide">
<div class="avatar" id="avatarHuruf">A</div>
<b id="haloUser">Halo, Alvin</b><br>
<span id="skorUser" style="font-size:13px">🏆 Menang: 0 | Main: 0</span><br>
<button onclick="doLogout()" style="background:#ff5555;color:#fff">Keluar</button>
</div>

<div id="info"><b id="turn">Login Dulu Buat Main</b><br><span id="msg">Daftar / Login di atas dulu ya!</span></div>

<div id="menu" class="hide">
<button onclick="startOffline()">📱 Main Berdua (1 HP)</button><br>
<button onclick="showOnline()">🌐 Main Online (Beda HP)</button>
<div id="onlineBox" class="hide" style="margin-top:10px">
<button onclick="createRoom()">Buat Room</button>
<p>atau</p>
<input id="roomInput" placeholder="Masukin Kode Room"><br><br>
<button onclick="joinRoom()">Gabung Room</button>
<p id="roomInfo" style="font-size:13px;color:#ffcc00"></p>
<button onclick="copyLink()">📋 Salin Link Room</button>
</div>
</div>

<div id="board"></div>
<button onclick="location.reload()">🔄 Ulangi Game</button>
<p>Putih = Kamu &nbsp; Hitam = Lawan<br>Hijau = Bisa Jalan, Merah = Bisa Makan</p>
<script>
var board=[
["♜","♞","♝","♛","♚","♝","♞","♜"],
["♟","♟","♟","♟","♟","♟","♟","♟"],
["","","","","","","",""],
["","","","","","","",""],
["","","","","","","",""],
["","","","","","","",""],
["♙","♙","♙","♙","♙","♙","♙","♙"],
["♖","♘","♗","♕","♔","♗","♘","♖"]];
var turn="w"; var selR=-1; var selC=-1; var moves=[];
var W="♔♕♖♗♘♙"; var B="♚♛♜♝♞♟";
var mode="offline"; var myColor="w"; var peer=null; var conn=null; var myRoom="";
var currentUser=""; var isLogin=false;
function isW(p){return W.indexOf(p)>=0}
function isB(p){return B.indexOf(p)>=0}
function inside(r,c){return r>=0&&r<8&&c>=0&&c<8}
// LOGIN SYSTEM
function getUsers(){try{return JSON.parse(localStorage.getItem("catur_users")||"{}")}catch(e){return {}}}
function saveUsers(u){localStorage.setItem("catur_users",JSON.stringify(u))}
function getSkor(n){try{return JSON.parse(localStorage.getItem("catur_skor_"+n)||'{"win":0,"main":0}')}catch(e){return {win:0,main:0}}}
function saveSkor(n,s){localStorage.setItem("catur_skor_"+n,JSON.stringify(s))}
function updateBar(){
var s=getSkor(currentUser);
document.getElementById("haloUser").innerHTML="Halo, "+currentUser+" 👋";
document.getElementById("avatarHuruf").innerHTML=currentUser.charAt(0).toUpperCase();
document.getElementById("skorUser").innerHTML="🏆 Menang: "+s.win+" | Main: "+s.main;
}
function doDaftar(){
var n=document.getElementById("userName").value.trim(); var p=document.getElementById("userPass").value.trim();
if(!n||!p){document.getElementById("loginMsg").innerHTML="Isi nama + password dulu!"; return;}
var u=getUsers(); if(u[n]){document.getElementById("loginMsg").innerHTML="Nama udah ada, tinggal Login aja!"; return;}
u[n]=p; saveUsers(u); saveSkor(n,{win:0,main:0});
document.getElementById("loginMsg").innerHTML="Berhasil daftar! Sekarang pencet Login!";
}
function doLogin(){
var n=document.getElementById("userName").value.trim(); var p=document.getElementById("userPass").value.trim();
var u=getUsers();
if(!u[n]){document.getElementById("loginMsg").innerHTML="Akun belum ada, pencet Daftar dulu!"; return;}
if(u[n]!=p){document.getElementById("loginMsg").innerHTML="Password salah! Coba lagi!"; return;}
currentUser=n; isLogin=true; localStorage.setItem("catur_login",n);
document.getElementById("loginBox").classList.add("hide");
document.getElementById("userBar").classList.remove("hide");
document.getElementById("menu").classList.remove("hide");
updateBar();
document.getElementById("turn").innerHTML="Selamat Datang, "+n+"!";
document.getElementById("msg").innerHTML="Pilih mode main di bawah!";
draw();
}
function doLogout(){localStorage.removeItem("catur_login"); location.reload();}
var saved=localStorage.getItem("catur_login");
if(saved){document.getElementById("userName").value=saved; document.getElementById("userPass").value=getUsers()[saved]||""; }
// GAME
function getMoves(r,c){
var p=board[r][c]; var m=[]; var me=turn;
function add(rr,cc){if(!inside(rr,cc))return; var t=board[rr][cc]; if(t=="")m.push([rr,cc]); else if((me=="w"&&isB(t))||(me=="b"&&isW(t)))m.push([rr,cc]);}
function slide(dirs){for(var i=0;i<dirs.length;i++){var dr=dirs[i][0];var dc=dirs[i][1];var rr=r+dr;var cc=c+dc;while(inside(rr,cc)){var t=board[rr][cc];if(t=="")m.push([rr,cc]);else{if((me=="w"&&isB(t))||(me=="b"&&isW(t)))m.push([rr,cc]);break;}rr+=dr;cc+=dc;}}}
if(p=="♙"||p=="♟"){var dir=(p=="♙"?-1:1);var start=(p=="♙"?6:1);if(inside(r+dir,c)&&board[r+dir][c]==""){m.push([r+dir,c]);if(r==start&&board[r+dir*2][c]=="")m.push([r+dir*2,c]);}for(var k=-1;k<=1;k+=2){var rr2=r+dir;var cc2=c+k;if(inside(rr2,cc2)){var t2=board[rr2][cc2];if(t2!=""&&((me=="w"&&isB(t2))||(me=="b"&&isW(t2))))m.push([rr2,cc2]);}}}
if(p=="♘"||p=="♞"){var kn=[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]];for(var j=0;j<kn.length;j++)add(r+kn[j][0],c+kn[j][1]);}
if(p=="♗"||p=="♝"||p=="♕"||p=="♛")slide([[1,1],[1,-1],[-1,1],[-1,-1]]);
if(p=="♖"||p=="♜"||p=="♕"||p=="♛")slide([[1,0],[-1,0],[0,1],[0,-1]]);
if(p=="♔"||p=="♚"){for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){if(dr!=0||dc!=0)add(r+dr,c+dc);}}
return m;
}
function draw(){
var html="";
for(var r=0;r<8;r++){
var rr=(mode=="online"&&myColor=="b")?7-r:r;
html+='<div class="row">';
for(var c=0;c<8;c++){
var cc=(mode=="online"&&myColor=="b")?7-c:c;
var p=board[rr][cc];
var cls="cell "+(((rr+cc)%2==0)?"w":"b");
if(selR==rr&&selC==cc)cls="cell sel";
for(var i=0;i<moves.length;i++){if(moves[i][0]==rr&&moves[i][1]==cc){if(board[rr][cc]=="")cls="cell dot";else cls="cell eat";}}
var pc=""; if(isW(p))pc=" pW"; else if(isB(p))pc=" pB";
html+='<div class="'+cls+pc+'" onclick="clickCell('+rr+','+cc+')">'+p+'</div>';
}
html+='</div>';
}
document.getElementById("board").innerHTML=html;
if(isLogin){
if(mode=="offline") document.getElementById("turn").innerHTML="Giliran: "+(turn=="w"?"Putih":"Hitam");
else document.getElementById("turn").innerHTML="Kamu: "+(myColor=="w"?"Putih":"Hitam")+" | Giliran: "+(turn=="w"?"Putih":"Hitam")+(turn==myColor?" - JALAN KAMU!":" - Tunggu Lawan...");
}
}
function doMove(fr,fc,tr,tc,send){
board[tr][tc]=board[fr][fc]; board[fr][fc]="";
selR=-1; selC=-1; moves=[]; turn=(turn=="w"?"b":"w");
document.getElementById("msg").innerHTML="Mantap! Pindah!";
if(send&&conn&&conn.open) conn.send({fr:fr,fc:fc,tr:tr,tc:tc});
draw();
}
function clickCell(r,c){
if(!isLogin){document.getElementById("msg").innerHTML="Login dulu baru bisa main!"; return;}
if(mode=="online"&&turn!=myColor){document.getElementById("msg").innerHTML="Bukan giliran kamu, tunggu lawan!"; return;}
var p=board[r][c]; var isTarget=false;
for(var i=0;i<moves.length;i++){if(moves[i][0]==r&&moves[i][1]==c)isTarget=true;}
if(selR>=0&&isTarget){doMove(selR,selC,r,c,true);}
else if(p!=""&&((turn=="w"&&isW(p))||(turn=="b"&&isB(p)))){selR=r; selC=c; moves=getMoves(r,c); document.getElementById("msg").innerHTML="Pilih kotak hijau / merah!";}
else{selR=-1; selC=-1; moves=[];}
draw();
}
function startOffline(){if(!isLogin){alert("Login dulu!"); return;} mode="offline"; document.getElementById("menu").classList.add("hide"); document.getElementById("msg").innerHTML="Main berdua 1 HP, gantian ya!"; if(currentUser){var s=getSkor(currentUser); s.main++; saveSkor(currentUser,s); updateBar();} draw();}
function showOnline(){if(!isLogin){alert("Login dulu!"); return;} document.getElementById("onlineBox").classList.remove("hide");}
function createRoom(){
myRoom="catur-"+Math.floor(Math.random()*90000+10000); myColor="w"; mode="online";
peer=new Peer(myRoom);
peer.on("open",function(){document.getElementById("roomInfo").innerHTML="Kode Room Kamu: <b>"+myRoom+"</b><br>Kirim ke temen lu! Menunggu..."; document.getElementById("menu").classList.add("hide"); document.getElementById("msg").innerHTML="Kamu Putih. Tunggu lawan..."; draw();});
peer.on("connection",function(c){conn=c; conn.on("data",function(d){doMove(d.fr,d.fc,d.tr,d.tc,false);}); conn.on("open",function(){document.getElementById("msg").innerHTML="Lawan udah gabung! Kamu jalan duluan!"; draw();});});
}
function joinRoom(){
var code=document.getElementById("roomInput").value.trim(); if(!code){alert("Masukin kode dulu!"); return;}
myColor="b"; mode="online"; myRoom=code; peer=new Peer();
peer.on("open",function(){conn=peer.connect(code); conn.on("open",function(){document.getElementById("menu").classList.add("hide"); document.getElementById("msg").innerHTML="Nyambung! Kamu Hitam, tunggu Putih jalan..."; draw();}); conn.on("data",function(d){doMove(d.fr,d.fc,d.tr,d.tc,false);});});
}
function copyLink(){var link=location.href.split("?")[0]+"?room="+myRoom; if(navigator.clipboard) navigator.clipboard.writeText(link); alert("Link tersalin! Kirim ke temen lu:\n"+link);}
var q=new URLSearchParams(location.search); if(q.get("room")){document.getElementById("onlineBox").classList.remove("hide"); document.getElementById("roomInput").value=q.get("room");}
draw();
</script>
</body></html>
